<path d="M833 553 H1057 L1069 565 V671 H833 Z" fill="#fff" stroke="#000" stroke-width="1"/><path d="M1057 553 V565 H1069" fill="none" stroke="#000" stroke-width="1"/><text x="843" y="571" font-size="10" font-weight="700">Access rules enforced by QRganize:</text><text x="843" y="585" font-size="10" font-weight="400">• Administrator: full access.</text><text x="843" y="599" font-size="10" font-weight="400">• Program Chair: Block Creation limited to</text><text x="843" y="613" font-size="10" font-weight="400">   own program; faculty records view-only.</text><text x="843" y="627" font-size="10" font-weight="400">• Department Chair: faculty records</text><text x="843" y="641" font-size="10" font-weight="400">   view-only; cannot generate QR codes</text><text x="843" y="655" font-size="10" font-weight="400">   or manage accounts &amp; settings.</text><line x1="845" y1="527" x2="845" y2="553" stroke="#000" stroke-width="1" stroke-dasharray="4 3"/>
