# Render Blueprint — QRganize backend (API + uploaded files).
# Render → New → Blueprint → pick this repo. Secrets marked `sync: false`
# are asked for in the Render dashboard; they are never stored in git.
# Full guide: DEPLOYMENT.md
services:
  - type: web
    name: qrganize-backend
    runtime: node
    # Persistent disk (below) is optional (uploads are stored in the database) and needs a paid instance
    plan: starter
    # npm workspaces: install at the repo root so packages/shared resolves
    # --include=dev: NODE_ENV=production would otherwise skip the build tools (cross-env, TypeScript)
    buildCommand: npm ci --include=dev && npm run build -w @qrganize/backend
    # `next start` listens on $PORT, which Render provides
    startCommand: npm run start:prod -w @qrganize/backend
    # Public endpoint that also touches the database
    healthCheckPath: /api/settings/logo
    autoDeploy: true
    disk:
      name: qrganize-uploads
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Neon connection string (pooled), e.g. postgresql://…-pooler…neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      # Optional: photos/logo now live in the database; this only serves older files left on the disk
      - key: UPLOAD_DIR
        value: /var/data/uploads
      # Behind Vercel + Render proxies — read the real client IP for rate limiting
      - key: TRUST_PROXY
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
